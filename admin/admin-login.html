
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ShopNext</title>

    <style>
        :root{
            --bg:#0b0d10;
            --card:#11151b;
            --card2:#151a20;
            --border:#252b34;
            --text:#f5f7fa;
            --muted:#858c98;
            --primary:#7c5cff;
            --primary-hover:#6d4ff0;
            --danger:#ef4444;
            --success:#22c55e;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            width:100%;
            min-height:100%;
        }

        body{
            font-family:Inter,Segoe UI,Arial,sans-serif;
            background:
                radial-gradient(circle at top left, rgba(124,92,255,.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(124,92,255,.08), transparent 28%),
                var(--bg);
            color:var(--text);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }

        .login-wrapper{
            width:100%;
            max-width:460px;
        }

        .brand{
            display:flex;
            justify-content:center;
            margin-bottom:24px;
        }

        .admin-logo{
            display:flex;
            align-items:center;
            gap:11px;
            text-decoration:none;
            color:var(--text);
        }

        .admin-logo-mark{
            width:42px;
            height:42px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:12px;
            background:var(--primary);
            color:#fff;
            font-size:20px;
            font-weight:900;
            box-shadow:0 10px 25px rgba(124,92,255,.25);
        }

        .admin-logo-text{
            font-size:22px;
            font-weight:800;
            letter-spacing:-.5px;
        }

        .login-card{
            background:rgba(17,21,27,.96);
            border:1px solid var(--border);
            border-radius:20px;
            padding:34px;
            box-shadow:
                0 25px 80px rgba(0,0,0,.40),
                0 0 0 1px rgba(255,255,255,.01);
            backdrop-filter:blur(10px);
        }

        .login-heading{
            text-align:center;
            margin-bottom:28px;
        }

        .login-heading h1{
            font-size:28px;
            font-weight:800;
            letter-spacing:-.7px;
            margin-bottom:8px;
        }

        .login-heading p{
            color:var(--muted);
            font-size:14px;
            line-height:1.6;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-label{
            display:block;
            margin-bottom:8px;
            font-size:13px;
            font-weight:700;
            color:#dfe3e8;
        }

        .input-wrap{
            position:relative;
        }

        .form-control{
            width:100%;
            height:50px;
            border:1px solid var(--border);
            border-radius:12px;
            background:var(--card2);
            color:var(--text);
            padding:0 14px;
            outline:none;
            font-size:14px;
            transition:.2s ease;
        }

        .form-control.password-input{
            padding-right:52px;
        }

        .form-control::placeholder{
            color:#68707b;
        }

        .form-control:focus{
            border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(124,92,255,.12);
        }

        .password-toggle{
            position:absolute;
            top:50%;
            right:10px;
            transform:translateY(-50%);
            width:34px;
            height:34px;
            border:none;
            background:transparent;
            color:#8d95a1;
            cursor:pointer;
            border-radius:8px;
            font-size:16px;
        }

        .password-toggle:hover{
            background:#1c222a;
            color:#fff;
        }

        .login-options{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin:4px 0 22px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:8px;
            color:var(--muted);
            font-size:13px;
            cursor:pointer;
            user-select:none;
        }

        .remember input{
            width:16px;
            height:16px;
            accent-color:var(--primary);
        }

        .forgot{
            color:#a99bff;
            text-decoration:none;
            font-size:13px;
        }

        .forgot:hover{
            color:#c0b7ff;
        }

        .login-btn{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:var(--primary);
            color:#fff;
            font-size:14px;
            font-weight:800;
            cursor:pointer;
            transition:.2s ease;
            box-shadow:0 10px 25px rgba(124,92,255,.18);
        }

        .login-btn:hover{
            background:var(--primary-hover);
            transform:translateY(-1px);
            box-shadow:0 14px 30px rgba(124,92,255,.24);
        }

        .login-btn:active{
            transform:translateY(0);
        }

        .login-btn.loading{
            opacity:.75;
            cursor:not-allowed;
        }

        .message{
            display:none;
            margin-bottom:18px;
            padding:12px 14px;
            border-radius:10px;
            font-size:13px;
            line-height:1.5;
        }

        .message.error{
            display:block;
            background:rgba(239,68,68,.10);
            border:1px solid rgba(239,68,68,.25);
            color:#ff8b8b;
        }

        .message.success{
            display:block;
            background:rgba(34,197,94,.10);
            border:1px solid rgba(34,197,94,.25);
            color:#7ee2a0;
        }

        .demo-box{
            margin-top:22px;
            padding:14px;
            background:#0d1014;
            border:1px dashed #303640;
            border-radius:12px;
        }

        .demo-box-title{
            color:#dfe3e8;
            font-size:12px;
            font-weight:800;
            margin-bottom:8px;
        }

        .demo-box p{
            color:var(--muted);
            font-size:12px;
            line-height:1.7;
        }

        .demo-box strong{
            color:#dfe3e8;
        }

        .back-store{
            display:block;
            text-align:center;
            margin-top:20px;
            color:var(--muted);
            text-decoration:none;
            font-size:13px;
        }

        .back-store:hover{
            color:#fff;
        }

        .footer-note{
            text-align:center;
            margin-top:18px;
            color:#5f6670;
            font-size:11px;
        }

        @media (max-width:520px){
            body{
                padding:16px;
            }

            .login-card{
                padding:24px 20px;
                border-radius:16px;
            }

            .login-heading h1{
                font-size:24px;
            }

            .login-options{
                flex-direction:column;
                align-items:flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <!-- Brand -->
        <div class="brand">
            <a href="index.html" class="admin-logo">
                <span class="admin-logo-mark">A</span>
                <span class="admin-logo-text">ShopNext</span>
            </a>
        </div>

        <!-- Login Card -->
        <div class="login-card">

            <div class="login-heading">
                <h1>Admin Login</h1>
                <p>Sign in to access your ShopNext admin dashboard.</p>
            </div>

            <div id="message" class="message"></div>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label class="form-label" for="adminEmail">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="adminEmail"
                        class="form-control"
                        placeholder="Enter admin email or username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">
                        Password
                    </label>

                    <div class="input-wrap">
                        <input
                            type="password"
                            id="adminPassword"
                            class="form-control password-input"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            id="rememberMe"
                        >
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Sign In
                </button>

            </form>

            <!-- Demo credentials -->
            <div class="demo-box">
                <div class="demo-box-title">
                    Demo Admin Account
                </div>

                <p>
                    Email:
                    <strong>admin@shopnext.com</strong>
                </p>

                <p>
                    Password:
                    <strong>Admin@123</strong>
                </p>
            </div>

        </div>

        <a href="../index.html" class="back-store">
            ← Back to Store
        </a>

        <div class="footer-note">
            ShopNext Admin Panel
        </div>

    </div>

    <script>
        (() => {

            const AUTH_KEY = "shopnext_admin_auth";
            const REMEMBER_KEY = "shopnext_admin_remember";

            const form = document.getElementById("adminLoginForm");
            const emailInput = document.getElementById("adminEmail");
            const passwordInput = document.getElementById("adminPassword");
            const rememberMe = document.getElementById("rememberMe");
            const loginBtn = document.getElementById("loginBtn");
            const message = document.getElementById("message");
            const passwordToggle = document.getElementById("passwordToggle");
            const forgotPassword = document.getElementById("forgotPassword");

            const ADMIN_EMAIL = "admin@shopnext.com";
            const ADMIN_USERNAME = "admin";
            const ADMIN_PASSWORD = "Admin@123";

            function showMessage(text, type = "error") {
                message.textContent = text;
                message.className = `message ${type}`;
            }

            function hideMessage() {
                message.textContent = "";
                message.className = "message";
            }

            function saveAuth(remember = false) {
                const authData = {
                    loggedIn: true,
                    email: ADMIN_EMAIL,
                    role: "admin",
                    loginTime: Date.now()
                };

                try {
                    localStorage.setItem(
                        AUTH_KEY,
                        JSON.stringify(authData)
                    );

                    if (remember) {
                        localStorage.setItem(
                            REMEMBER_KEY,
                            "true"
                        );
                    } else {
                        sessionStorage.setItem(
                            AUTH_KEY,
                            JSON.stringify(authData)
                        );
                        localStorage.removeItem(REMEMBER_KEY);
                    }

                } catch (error) {
                    console.error("Authentication storage error:", error);
                }
            }

            function isAlreadyLoggedIn() {
                try {
                    const localAuth = JSON.parse(
                        localStorage.getItem(AUTH_KEY)
                    );

                    const sessionAuth = JSON.parse(
                        sessionStorage.getItem(AUTH_KEY)
                    );

                    return (
                        (localAuth && localAuth.loggedIn === true) ||
                        (sessionAuth && sessionAuth.loggedIn === true)
                    );

                } catch (error) {
                    return false;
                }
            }

            function redirectToAdmin() {
                window.location.href = "index.html";
            }

            // Prevent logged-in user from seeing login page again
            if (isAlreadyLoggedIn()) {
                redirectToAdmin();
                return;
            }

            // Load remembered username
            try {
                const rememberedEmail =
                    localStorage.getItem("shopnext_admin_email");

                if (rememberedEmail) {
                    emailInput.value = rememberedEmail;
                    rememberMe.checked = true;
                }

            } catch (error) {
                console.error(error);
            }

            // Password show/hide
            passwordToggle.addEventListener("click", () => {

                const isPassword =
                    passwordInput.type === "password";

                passwordInput.type =
                    isPassword ? "text" : "password";

                passwordToggle.textContent =
                    isPassword ? "🙈" : "👁";

                passwordToggle.setAttribute(
                    "aria-label",
                    isPassword
                        ? "Hide password"
                        : "Show password"
                );
            });

            // Forgot password
            forgotPassword.addEventListener("click", (event) => {

                event.preventDefault();

                showMessage(
                    "For now, please contact the main administrator to reset the admin password.",
                    "error"
                );
            });

            // Login
            form.addEventListener("submit", (event) => {

                event.preventDefault();

                hideMessage();

                const emailOrUsername =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;

                if (!emailOrUsername || !password) {
                    showMessage(
                        "Please enter your login details."
                    );
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.classList.add("loading");
                loginBtn.textContent = "Signing in...";

                setTimeout(() => {

                    const validUser =
                        emailOrUsername.toLowerCase() === ADMIN_EMAIL.toLowerCase() ||
                        emailOrUsername.toLowerCase() === ADMIN_USERNAME;

                    const validPassword =
                        password === ADMIN_PASSWORD;

                    if (validUser && validPassword) {

                        saveAuth(
                            rememberMe.checked
                        );

                        try {
                            localStorage.setItem(
                                "shopnext_admin_email",
                                emailOrUsername
                            );
                        } catch (error) {
                            console.error(error);
                        }

                        showMessage(
                            "Login successful. Opening admin dashboard...",
                            "success"
                        );

                        setTimeout(() => {
                            redirectToAdmin();
                        }, 500);

                    } else {

                        showMessage(
                            "Incorrect admin email/username or password."
                        );

                        loginBtn.disabled = false;
                        loginBtn.classList.remove("loading");
                        loginBtn.textContent = "Sign In";

                    }

                }, 450);
            });

        })();
    </script>

</body>
</html>
